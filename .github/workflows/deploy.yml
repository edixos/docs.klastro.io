name: Build & Deploy

# Documentation ships on merge, like the klastro.io marketing site: a typo fix
# must not wait for the application's release train.
#
#   build   — every pull request and every push to main. Needs no secrets, so a
#             pull request gets the same type-check, locale-parity check, build
#             and internal-link validation as main.
#   deploy  — main (and manual dispatch) only. Consumes the artifact `build`
#             produced, so the bytes that were verified are the bytes that ship.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# Never race two publishes of main; other refs may be superseded freely.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Full history: Starlight's "Last updated" date reads each page's git
        # log, and a shallow clone would stamp every page with the same date.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type-check plus locale parity: every page must exist in fr and en.
      - name: Check
        run: npm run check

      # starlight-links-validator runs inside the build and fails it on any
      # broken internal link or anchor.
      - name: Build static site
        run: npm run build

      - name: Upload static bundle
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Secrets live in the "production" GitHub Environment.
    # See docs/cloudflare-deployment.md for the one-time setup.
    environment:
      name: production
      url: https://docs.klastro.io

    steps:
      - name: Download static bundle
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=docs-klastro-io --branch=main
